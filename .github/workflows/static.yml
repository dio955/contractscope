# Deploy static content to GitHub Pages (ContractScope)
#
# Standard GitHub starter workflow for a static site. Deploying via Actions
# bypasses Jekyll entirely, so `.well-known/` and `_`-prefixed paths are
# published as-is (`.nojekyll` at the repo root is kept as a second line of
# defence in case anyone ever switches the Pages source back to "Deploy from
# a branch").
#
# The whole `contractscope/` folder is the repo root, so the artifact path is
# '.' — every file in the repo is published, including this workflow itself
# (harmless: `.github/` is served but contains no secrets).

name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
